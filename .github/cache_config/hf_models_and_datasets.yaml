# vLLM benchmark replay traces, fetched from Artifactory rather than HuggingFace.
#
# `base_url` and `root` come from the ARTIFACTORY_BASE_URL and
# ARTIFACTORY_DATA_PATH secrets, so the internal host is not written down here.
# Each entry is verified against its sha256 after download and skipped when a
# correct copy is already cached, so a re-dispatch is cheap and idempotent.
#
# Only the traces that a benchmark config actually replays are listed. The
# Artifactory prefix holds 13 files (474MB); these 2 are the ones referenced by
# benchmarks/spyre/serve-tests.yaml, so the other 11 are deliberately not cached.
artifactory_datasets:
  subdir: spyre-inference/vllm-bench-data/converted_traces/2025.11.03_e2ee1b0_reordered
  files:
    - name: aiops_results_2025.11.03_e2ee1b0_correct_order.jsonl
      sha256: 468cf059f2ec3b14108efc09baffabf5c5a440172a25660673d5a8fa029d0637
    - name: cics_results_2025.11.03_e2ee1b0_correct_order.jsonl
      sha256: e0efa895b4a22b601748c7dda9e8a2db146773fb8735fc45ee2920c042b40fb7
