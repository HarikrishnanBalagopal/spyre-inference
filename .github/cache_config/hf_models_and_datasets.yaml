# gated_models: Cached via manual add_or_remove_artifacts_from_cache dispatch on main.
# public_models: Auto-cached by test_each_commit.yaml.
# artifactory_datasets: Cached via the same manual dispatch. These need an
#   Artifactory credential, which GitHub withholds from pull_request runs on a
#   fork, so they cannot be fetched by the job that consumes them. Populating
#   them here instead keeps the benchmark read-only and credential-free.

